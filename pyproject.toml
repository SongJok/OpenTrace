[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta:__legacy__"

[project]
name = "opentrace"
version = "0.1.0"
description = "Self-hosted enterprise AgentOS for governed data, knowledge, and automation"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [
    {name = "OpenTrace Team"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Web framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1.5",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "pypdf>=5.0.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "asyncmy==0.2.9; platform_system == 'Linux' and platform_machine == 'aarch64'",
    "asyncmy>=0.2.10; platform_system != 'Linux' or platform_machine != 'aarch64'",
    "alembic>=1.13.1",
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.2.5",
    "clickhouse-sqlalchemy>=0.3.2",
    "asynch>=0.2.5,<0.4",

    # Redis
    "redis[hiredis]>=5.0.4",

    # LLM / AI
    "openai>=1.30.0",
    "dashscope>=1.22.1",
    "tiktoken>=0.7.0",
    "tenacity>=8.3.0",

    # Auth / Security
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=3.2.0,<4.0.0",
    "python-dotenv>=1.0.1",

    # Serialization
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    "orjson>=3.10.3",

    # Observability / Tracing (OpenTelemetry)
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.45b0",
    "opentelemetry-instrumentation-redis>=0.45b0",
    "opentelemetry-instrumentation-httpx>=0.45b0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.24.0",
    "prometheus-client>=0.20.0",

    # Email
    "aiosmtplib>=3.0.1",
    "jinja2>=3.1.4",

    # Utilities
    "anyio>=4.4.0",
    "python-dateutil>=2.9.0",
    "structlog>=24.2.0",
    "rich>=13.7.1",
    "click>=8.1.7",
    "PyYAML>=6.0.1",
    "networkx>=3.3",
    "numpy>=1.26.4",
    "scipy>=1.13.0",
    "sqlglot>=25.0.0",
    "matplotlib>=3.8.0",
    "plotly>=5.22.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "black>=24.4.2",
    "ruff>=0.4.5",
    "mypy>=1.10.0",
    "pre-commit>=3.7.1",
    "import-linter>=2.0",
]

[project.scripts]
opentrace = "gateway.api_gateway.main:cli"

[project.urls]
Homepage = "https://github.com/SongJok/OpenTrace"
Repository = "https://github.com/SongJok/OpenTrace"
Issues = "https://github.com/SongJok/OpenTrace/issues"

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*", "deploy*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Repo root on sys.path so `import kernel`, `import agents`, etc. work without editable install
pythonpath = ["."]
