[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta:__legacy__"

[project]
name = "opentrace"
version = "0.1.0"
description = "Self-hosted enterprise AgentOS for governed data, knowledge, and automation"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {file = "LICENSE"}
authors = [
    {name = "OpenTrace Team"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Web framework
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.3",
    "httpx>=0.28.1",
    "websockets>=17.0.1",
    "python-multipart>=0.0.32",
    "openpyxl>=3.1.5",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "pypdf>=6.16.1",

    # Database
    "sqlalchemy[asyncio]>=2.0.52",
    "asyncpg>=0.31.0",
    "aiomysql>=0.3.2",
    "alembic>=1.19.1",
    "psycopg2-binary>=2.9.12",
    "pgvector>=0.5.0",
    "clickhouse-sqlalchemy>=0.3.2",
    "asynch>=0.4.0,<0.5",

    # Redis
    "redis[hiredis]>=8.1.0",

    # LLM / AI
    "openai>=3.1.0",
    "dashscope>=1.26.7",
    "tiktoken>=0.13.0",
    "tenacity>=9.1.4",

    # Auth / Security
    "PyJWT[crypto]>=2.13.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=5.0.0,<6.0.0",
    "python-dotenv>=1.2.2",

    # Serialization
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "orjson>=3.12.0",

    # Observability / Tracing (OpenTelemetry)
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.65b0",
    "opentelemetry-instrumentation-redis>=0.65b0",
    "opentelemetry-instrumentation-httpx>=0.65b0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.44.0",
    "prometheus-client>=0.26.0",

    # Email
    "aiosmtplib>=5.1.2",
    "jinja2>=3.1.6",

    # Utilities
    "anyio>=4.14.2",
    "python-dateutil>=2.9.0.post0",
    "structlog>=26.1.0",
    "rich>=15.0.0",
    "click>=8.4.2",
    "PyYAML>=6.0.3",
    "networkx>=3.6.1",
    "numpy>=2.4.6",
    "sqlglot>=30.17.0",
    "matplotlib>=3.11.1",
    "plotly>=6.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "httpx>=0.28.1",
    "black>=26.5.1",
    "ruff>=0.16.3",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "import-linter>=2.13",
    "pip-audit>=2.10.1",
    "types-PyYAML>=6.0.12.20260815",
]

[project.scripts]
opentrace = "gateway.api_gateway.main:cli"

[project.urls]
Homepage = "https://github.com/SongJok/OpenTrace"
Repository = "https://github.com/SongJok/OpenTrace"
Issues = "https://github.com/SongJok/OpenTrace/issues"

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*", "deploy*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Repo root on sys.path so `import kernel`, `import agents`, etc. work without editable install
pythonpath = ["."]
