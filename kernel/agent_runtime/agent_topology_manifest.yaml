# Agent Topology Manifest — single source of truth for capability/agent topology.
# Version bumps require contract test updates (test_agent_runtime_v3_contract.py).
version: "4.0.0"

runtimes:
  tier0_kernel:
    description: Cognitive kernel + gateway + supervisor
  tier1_executive:
    description: cognitive_executive capability dispatch
  tier1_data:
    description: data_intelligence runtime (DataAgent V2 supervisor + DAG)
  tier2_nodes:
    description: Internal DAG / pipeline nodes (not direct capability dispatch)

entries:
  # ── Tier-1 capabilities (bootstrap + worker must register) ──
  data:
    runtime: tier1
    owner_runtime: tier1_data
    capability_type: data_query
    registry_name: data
    bootstrap: true
    worker: true
    bus_eligible: true
    contract:
      risk_tier: medium
      max_latency_ms: 120000
      dependencies: []

  rag:
    runtime: tier1
    owner_runtime: tier1_executive
    capability_type: document_retrieval
    registry_name: rag
    bootstrap: true
    worker: true
    bus_eligible: true
    contract:
      risk_tier: low
      max_latency_ms: 60000
      dependencies: []

  # ── Tier-2 Data V2 DAG nodes (manifest only; not CapabilityRegistry agents) ──
  data_knowledge:
    runtime: tier2
    owner_runtime: tier1_data
    capability_type: data_query
    node_role: knowledge
    bootstrap: false
    worker: false

  data_intent:
    runtime: tier2
    owner_runtime: tier1_data
    capability_type: data_query
    node_role: intent
    bootstrap: false
    worker: false

  data_entity:
    runtime: tier2
    owner_runtime: tier1_data
    capability_type: data_query
    node_role: entity
    bootstrap: false
    worker: false

  data_metric:
    runtime: tier2
    owner_runtime: tier1_data
    capability_type: data_query
    node_role: metric
    bootstrap: false
    worker: false

  data_time:
    runtime: tier2
    owner_runtime: tier1_data
    capability_type: data_query
    node_role: time
    bootstrap: false
    worker: false

  data_join:
    runtime: tier2
    owner_runtime: tier1_data
    capability_type: data_query
    node_role: join
    bootstrap: false
    worker: false

  data_semantic:
    runtime: tier2
    owner_runtime: tier1_data
    capability_type: data_query
    node_role: semantic
    bootstrap: false
    worker: false
    topology:
      depends_on_nodes: [data_intent, data_entity]

  data_business_semantic:
    runtime: tier2
    owner_runtime: tier1_data
    capability_type: data_query
    node_role: business_semantic
    bootstrap: false
    worker: false
    topology:
      depends_on_nodes: [data_metric, data_time, data_intent]

  data_planner:
    runtime: tier2
    owner_runtime: tier1_data
    capability_type: data_query
    node_role: planner
    bootstrap: false
    worker: false

  data_compiler:
    runtime: tier2
    owner_runtime: tier1_data
    capability_type: data_query
    node_role: compiler
    bootstrap: false
    worker: false

  data_verification:
    runtime: tier2
    owner_runtime: tier1_data
    capability_type: data_query
    node_role: verification
    bootstrap: false
    worker: false

topology_edges:
  - from: data_query
    to: fusion
  - from: document_retrieval
    to: fusion

bootstrap_agent_types:
  - data
  - rag

worker_agent_types:
  - data
  - rag
