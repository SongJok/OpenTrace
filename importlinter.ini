[importlinter]
root_packages =
    kernel
    agents

[importlinter:contract:runtime_gateway_slim]
name = RuntimeGateway must not depend on cognitive executive or planner facade
type = forbidden
source_modules =
    kernel.runtime_gateway
forbidden_modules =
    kernel.runtime.cognitive_executive
    kernel.cognition.planner_facade
    kernel.goal.goal_driven_planner

[importlinter:contract:vnext_no_v4]
name = vNext supervisor and dispatcher must not import legacy V4 orchestrator module path
type = forbidden
source_modules =
    kernel.runtime_gateway
    kernel.runtime.runtime_turn_dispatcher
    kernel.cognitive_supervisor.supervisor
    kernel.cognitive_supervisor.dispatch_enrichment
    kernel.cognitive_supervisor.run_outcomes
forbidden_modules =
    kernel.orchestrator_v4

[importlinter:contract:agents_no_gateway]
name = Agents must not import FastAPI gateway routers
type = forbidden
source_modules =
    agents
forbidden_modules =
    gateway.api_gateway