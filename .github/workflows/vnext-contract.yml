name: vnext-contract

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  vnext-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install package (editable)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Public release safety check
        run: python scripts/check_public_release.py

      - name: vNext architecture contract suite
        run: bash scripts/run_vnext_final_tests.sh

      - name: Enterprise cognitive OS contract suite
        run: bash scripts/run_enterprise_contract_tests.sh

      - name: Gateway silent-failure guard
        run: bash scripts/check_gateway_silent_failures.sh

      - name: Kernel silent-failure guard
        run: bash scripts/check_kernel_silent_failures.sh

      - name: Config sync (env example + flag docs)
        run: |
          PYTHONPATH=. python scripts/sync_env_example_to_docs.py
          PYTHONPATH=. python scripts/generate_feature_flag_docs.py

      - name: Import boundaries (shell + pytest)
        run: bash scripts/check_import_boundaries.sh

      - name: Import boundaries (import-linter)
        run: lint-imports --config importlinter.ini

      - name: Full pytest (migration consistency)
        run: python -m pytest -q --tb=no

  staging-profile-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      APP_ENV: staging
      GATEWAY_PORT: "14100"
      APP_PORT: "14100"
      APP_SECRET_KEY: "ci-staging-app-secret"
      JWT_SECRET: "ci-staging-jwt-secret"
      DATA_SECRET_KEY: "ci-staging-data-secret"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Staging profile + agent strict + enterprise contracts
        run: |
          python -m pytest tests/test_config_truth_contract.py \
            tests/test_agent_runtime_v3_strict_contract.py \
            tests/test_tenant_rls_contract.py \
            tests/test_billing_runtime_contract.py \
            tests/test_multi_tenant_runtime_contract.py \
            -q --tb=short

  frontend-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Frontend contract tests
        working-directory: frontend
        run: npm test -- --run
