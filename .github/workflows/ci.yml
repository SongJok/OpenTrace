name: opentrace-full-integration

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install from lock
        run: |
          python -m pip install uv==0.8.24
          uv pip install --system --require-hashes -r requirements-dev.lock
          uv pip install --system --no-deps -e .
      - name: Run local-equivalent full backend gate
        run: PYTHON_BIN=python bash scripts/ci_full.sh --backend

  frontend-full:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Run local-equivalent frontend gate
        run: bash scripts/ci_full.sh --frontend

  postgres-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opentrace_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d opentrace_migration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install from lock
        run: |
          python -m pip install uv==0.8.24
          uv pip install --system --require-hashes -r requirements-dev.lock
          uv pip install --system --no-deps -e .
      - name: Real PostgreSQL migration lifecycle
        env:
          MIGRATION_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/opentrace_migration_test
        run: PYTHON_BIN=python bash scripts/verify_migrations_postgres.sh

  docker-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prepare development configuration
        run: cp .env.example .env
      - name: Start stack and migrate
        run: bash start.sh --build
      - name: Durable runtime verification
        run: |
          bash scripts/verify_all_docker.sh
          bash scripts/verify_agent_bus_e2e.sh
      - name: Diagnostics
        if: failure()
        run: docker compose logs --tail=200 || true
      - name: Cleanup
        if: always()
        run: bash stop.sh --volumes
