name: opentrace-pr-fast

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install locked development dependencies
        run: |
          python -m pip install uv==0.8.24
          uv lock --check
          uv pip install --system --require-hashes -r requirements-dev.lock
          uv pip install --system --no-deps -e .
      - name: Run local-equivalent backend fast gate
        run: PYTHON_BIN=python bash scripts/ci_fast.sh --backend

  frontend-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Run local-equivalent frontend fast gate
        run: bash scripts/ci_fast.sh --frontend
