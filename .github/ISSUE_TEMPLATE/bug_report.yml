name: Bug report
description: Report a reproducible OpenTrace defect
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include API keys, passwords, private data, or production logs.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest safe sequence of steps.
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Version or commit
  - type: dropdown
    id: surface
    attributes:
      label: Area
      options:
        - Responses / Agent Loop
        - Database / DataAgent
        - Knowledge / RAG
        - Approval / Governance
        - Tasks / Alerts
        - Frontend
        - Deployment / Configuration
        - Other
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Include only redacted logs and relevant test output.
