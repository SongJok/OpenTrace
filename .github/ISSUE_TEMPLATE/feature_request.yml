name: Feature request
description: Propose a focused product or architecture improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Which user problem or operational gap should be solved?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the observable result rather than only an implementation.
    validations:
      required: true
  - type: textarea
    id: governance
    attributes:
      label: Security and governance considerations
      description: Note tenant scope, approvals, side effects, and data handling.
