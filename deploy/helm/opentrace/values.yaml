image:
  repository: ghcr.io/songjok/opentrace
  tag: latest
  pullPolicy: IfNotPresent
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
replicaCount:
  api: 2
workerPools:
  responses: {replicas: 2}
  agents: {replicas: 2}
  knowledge: {replicas: 1}
  scheduler: {replicas: 1}
serviceAccount:
  create: true
  annotations: {}
  name: ""
service:
  type: ClusterIP
  port: 14100
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: opentrace.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
config:
  appEnv: production
  databaseUrlSecretKey: API_DATABASE_URL
  workerDatabaseUrlSecretKey: WORKER_DATABASE_URL
  migrationDatabaseUrlSecretKey: MIGRATION_DATABASE_URL
  tokenDatabaseUrlSecretKey: TOKEN_DB_URL
  redisUrlSecretKey: REDIS_URL
  traceEnabled: "true"
  otlpEndpoint: http://otel-collector.observability:4317
  tenantRlsEnabled: "true"
secret:
  existingSecret: opentrace-secrets
migration:
  enabled: true
  backoffLimit: 3
api:
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: "2", memory: 2Gi}
worker:
  resources:
    requests: {cpu: 500m, memory: 1Gi}
    limits: {cpu: "4", memory: 4Gi}
autoscaling:
  api:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  worker:
    enabled: true
    minReplicas: 2
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70
podDisruptionBudget:
  enabled: true
  minAvailable: 1
networkPolicy:
  enabled: true
  ingressNamespaceSelector: {}
  observabilityNamespaceSelector: {}
nodeSelector: {}
tolerations: []
affinity: {}
