image:
  repository: ghcr.io/songjok/opentrace
  tag: "0.1.0"
  # 生产优先设置 sha256:...；配置后覆盖 tag。
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
revisionHistoryLimit: 5
progressDeadlineSeconds: 600
replicaCount:
  api: 2
workerPools:
  responses: {replicas: 2}
  agents: {replicas: 2}
  knowledge: {replicas: 1}
  scheduler: {replicas: 1}
serviceAccount:
  create: true
  annotations: {}
  name: ""
service:
  type: ClusterIP
  port: 14100
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: opentrace.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
config:
  appEnv: production
  databaseUrlSecretKey: API_DATABASE_URL
  workerDatabaseUrlSecretKey: WORKER_DATABASE_URL
  migrationDatabaseUrlSecretKey: MIGRATION_DATABASE_URL
  tokenDatabaseUrlSecretKey: TOKEN_DB_URL
  redisUrlSecretKey: REDIS_URL
  traceEnabled: "true"
  otlpEndpoint: http://otel-collector.observability:4317
  tenantRlsEnabled: "true"
secret:
  existingSecret: opentrace-secrets
migration:
  enabled: true
  backoffLimit: 3
api:
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: "2", memory: 2Gi}
worker:
  resources:
    requests: {cpu: 500m, memory: 1Gi}
    limits: {cpu: "4", memory: 4Gi}
autoscaling:
  api:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  worker:
    enabled: true
    minReplicas: 2
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70
podDisruptionBudget:
  enabled: true
  minAvailable: 1
networkPolicy:
  enabled: true
  ingressNamespaceSelector:
    matchLabels: {kubernetes.io/metadata.name: ingress-nginx}
  observabilityNamespaceSelector:
    matchLabels: {kubernetes.io/metadata.name: observability}
  dns:
    namespaceSelector:
      matchLabels: {kubernetes.io/metadata.name: kube-system}
    podSelector:
      matchLabels: {k8s-app: kube-dns}
  database:
    port: 5432
    namespaceSelector:
      matchLabels: {kubernetes.io/metadata.name: data}
    podSelector:
      matchLabels: {app.kubernetes.io/name: postgresql}
    cidrs: []
  redis:
    port: 6379
    namespaceSelector:
      matchLabels: {kubernetes.io/metadata.name: data}
    podSelector:
      matchLabels: {app.kubernetes.io/name: redis}
    cidrs: []
  otlp:
    port: 4317
    namespaceSelector:
      matchLabels: {kubernetes.io/metadata.name: observability}
    podSelector:
      matchLabels: {app.kubernetes.io/name: opentelemetry-collector}
    cidrs: []
  # 模型、对象存储和 Connector 的公网 HTTPS CIDR 必须由平台团队显式准入。
  externalHttpsRanges: []
nodeSelector: {}
tolerations: []
affinity: {}
