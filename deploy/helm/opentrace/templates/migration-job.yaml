{{- if .Values.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "opentrace.fullname" . }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "opentrace.labels" . | nindent 4 }}
  annotations: {"helm.sh/hook": pre-install,pre-upgrade, "helm.sh/hook-delete-policy": before-hook-creation}
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  template:
    metadata:
      labels: {app.kubernetes.io/name: {{ include "opentrace.name" . }}, app.kubernetes.io/component: migration, opentrace.io/network-role: migration}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "opentrace.serviceAccountName" . }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      hostNetwork: false
      hostPID: false
      hostIPC: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: migrate
          image: {{ include "opentrace.image" . | quote }}
          command: ["python", "-m", "alembic", "upgrade", "head"]
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: {{ .Values.secret.existingSecret }}, key: {{ .Values.config.migrationDatabaseUrlSecretKey }}}}
            - {name: APP_ENV, value: {{ .Values.config.appEnv | quote }}}
            - {name: ENTERPRISE_TENANT_RLS_ENABLED, value: {{ .Values.config.tenantRlsEnabled | quote }}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
{{- end }}
