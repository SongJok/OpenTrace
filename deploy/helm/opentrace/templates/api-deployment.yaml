apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "opentrace.fullname" . }}-api
  labels:
    {{- include "opentrace.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.replicaCount.api }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  progressDeadlineSeconds: {{ .Values.progressDeadlineSeconds }}
  selector:
    matchLabels: {app.kubernetes.io/name: {{ include "opentrace.name" . }}, app.kubernetes.io/component: api}
  template:
    metadata:
      labels: {app.kubernetes.io/name: {{ include "opentrace.name" . }}, app.kubernetes.io/component: api, opentrace.io/network-role: runtime}
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "14100", prometheus.io/path: "/api/v1/metrics/prometheus"}
    spec:
      serviceAccountName: {{ include "opentrace.serviceAccountName" . }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      hostNetwork: false
      hostPID: false
      hostIPC: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: api
          image: {{ include "opentrace.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "uvicorn", "gateway.api_gateway.main:app", "--host", "0.0.0.0", "--port", "14100"]
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: {{ .Values.secret.existingSecret }}, key: {{ .Values.config.databaseUrlSecretKey }}}}
            {{- include "opentrace.env" . | nindent 12 }}
          ports: [{name: http, containerPort: 14100, protocol: TCP}]
          readinessProbe: {httpGet: {path: /api/v1/health/deps, port: http}, periodSeconds: 10, timeoutSeconds: 5, failureThreshold: 6}
          livenessProbe: {httpGet: {path: /api/v1/health, port: http}, periodSeconds: 20, timeoutSeconds: 5, failureThreshold: 3}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
