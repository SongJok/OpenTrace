global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/prometheus-rules.yml

scrape_configs:
  - job_name: opentrace-api
    metrics_path: /api/v1/metrics/prometheus
    static_configs:
      - targets: ["api:14100"]

  - job_name: opentrace-agent-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["agent-worker:9464"]
