x-opentrace-build: &opentrace-build
  context: .
  dockerfile: deploy/docker/Dockerfile
  args:
    PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.11-slim}
    OPENTRACE_BUILD_FINGERPRINT: ${OPENTRACE_BUILD_FINGERPRINT:-unknown}
    UV_VERSION: ${UV_VERSION:-0.8.24}
    UV_BOOTSTRAP_INDEX_URL: ${UV_BOOTSTRAP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple}
    UV_BOOTSTRAP_FALLBACK_INDEX_URL: ${UV_BOOTSTRAP_FALLBACK_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    UV_BOOTSTRAP_TIMEOUT: ${UV_BOOTSTRAP_TIMEOUT:-30}
    UV_BOOTSTRAP_RETRIES: ${UV_BOOTSTRAP_RETRIES:-1}
    UV_BOOTSTRAP_PRIMARY_MAX_SECONDS: ${UV_BOOTSTRAP_PRIMARY_MAX_SECONDS:-90}
    UV_BOOTSTRAP_FALLBACK_MAX_SECONDS: ${UV_BOOTSTRAP_FALLBACK_MAX_SECONDS:-300}
    PYTHON_DEPENDENCY_INDEX_URL: ${PYTHON_DEPENDENCY_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple}
    PYTHON_DEPENDENCY_FALLBACK_INDEX_URL: ${PYTHON_DEPENDENCY_FALLBACK_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    PYTHON_DEPENDENCY_PRIMARY_MAX_SECONDS: ${PYTHON_DEPENDENCY_PRIMARY_MAX_SECONDS:-180}
    PYTHON_DEPENDENCY_FALLBACK_MAX_SECONDS: ${PYTHON_DEPENDENCY_FALLBACK_MAX_SECONDS:-1200}
    PYTHON_DEPENDENCY_HTTP_TIMEOUT: ${PYTHON_DEPENDENCY_HTTP_TIMEOUT:-60}
    PYTHON_DEPENDENCY_HTTP_RETRIES: ${PYTHON_DEPENDENCY_HTTP_RETRIES:-3}
    PYTHON_DEPENDENCY_FALLBACK_ATTEMPTS: ${PYTHON_DEPENDENCY_FALLBACK_ATTEMPTS:-2}
    UV_CONCURRENT_DOWNLOADS: ${UV_CONCURRENT_DOWNLOADS:-4}
    UV_CONCURRENT_INSTALLS: ${UV_CONCURRENT_INSTALLS:-2}
    UV_CONCURRENT_BUILDS: ${UV_CONCURRENT_BUILDS:-1}

x-opentrace-frontend-build: &opentrace-frontend-build
  context: ./frontend
  dockerfile: Dockerfile
  args:
    OPENTRACE_FRONTEND_BUILD_FINGERPRINT: ${OPENTRACE_FRONTEND_BUILD_FINGERPRINT:-unknown}
    FRONTEND_NODE_BASE_IMAGE: ${FRONTEND_NODE_BASE_IMAGE:-docker.m.daocloud.io/library/node:20-alpine}
    FRONTEND_NGINX_BASE_IMAGE: ${FRONTEND_NGINX_BASE_IMAGE:-docker.m.daocloud.io/library/nginx:alpine}
    NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}

services:
  # -------------------------------------------------------------------------
  # PostgreSQL
  # -------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: opentrace_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: opentrace_v2
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------------------
  # Redis
  # -------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: opentrace_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # -------------------------------------------------------------------------
  # Skill 共享存储权限初始化，同时修复旧镜像创建的存量卷
  # -------------------------------------------------------------------------
  skill-storage-init:
    image: ${OPENTRACE_IMAGE:-opentrace-app:local}
    build: *opentrace-build
    user: "0:0"
    restart: "no"
    volumes:
      - skills_data:/app/skills/installed
      - skill_catalog_data:/app/skills/catalog_mirror
    command:
      - sh
      - -c
      - >-
        mkdir -p /app/skills/installed /app/skills/catalog_mirror &&
        chown -R 10001:10001 /app/skills/installed /app/skills/catalog_mirror

  # -------------------------------------------------------------------------
  # OpenTrace API Gateway — port 14100
  # -------------------------------------------------------------------------
  api:
    image: ${OPENTRACE_IMAGE:-opentrace-app:local}
    build: *opentrace-build
    container_name: opentrace_api
    restart: unless-stopped
    ports:
      - "14100:14100"
    env_file:
      - .env
    volumes:
      - skills_data:/app/skills/installed
      - skill_catalog_data:/app/skills/catalog_mirror
      - object_data:/var/lib/opentrace/objects
      - dws_data:/var/lib/opentrace/dws
    extra_hosts:
      - "host.docker.internal:host-gateway"
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-changeme}@postgres:5432/opentrace_v2
      TOKEN_DB_URL: postgresql://postgres:${POSTGRES_PASSWORD:-changeme}@postgres:5432/opentrace_v2
      REDIS_URL: redis://redis:6379/10
      DINGTALK_DWS_BINARY: ${DINGTALK_DWS_BINARY:-}
      DWS_CONFIG_DIR: ${DWS_CONFIG_DIR:-/var/lib/opentrace/dws}
      TRACE_ENABLED: ${TRACE_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4317}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1,host.docker.internal,.aliyuncs.com,dashscope.aliyuncs.com}
      no_proxy: ${no_proxy:-localhost,127.0.0.1,::1,host.docker.internal,.aliyuncs.com,dashscope.aliyuncs.com}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      ALL_PROXY: ${ALL_PROXY:-}
      http_proxy: ${http_proxy:-}
      https_proxy: ${https_proxy:-}
      all_proxy: ${all_proxy:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      skill-storage-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:14100/api/v1/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # -------------------------------------------------------------------------
  # React production frontend — Nginx static hosting and API reverse proxy
  # -------------------------------------------------------------------------
  frontend:
    image: ${OPENTRACE_FRONTEND_IMAGE:-opentrace-frontend:local}
    build: *opentrace-frontend-build
    container_name: opentrace_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-14108}:14108"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:14108/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # -------------------------------------------------------------------------
  # Agent Worker
  # -------------------------------------------------------------------------
  agent-worker:
    image: ${OPENTRACE_IMAGE:-opentrace-app:local}
    build: *opentrace-build
    container_name: opentrace_agent_worker
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - skills_data:/app/skills/installed
      - skill_catalog_data:/app/skills/catalog_mirror
      - object_data:/var/lib/opentrace/objects
    extra_hosts:
      - "host.docker.internal:host-gateway"
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-changeme}@postgres:5432/opentrace_v2
      TOKEN_DB_URL: postgresql://postgres:${POSTGRES_PASSWORD:-changeme}@postgres:5432/opentrace_v2
      REDIS_URL: redis://redis:6379/10
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1,host.docker.internal,.aliyuncs.com,dashscope.aliyuncs.com}
      no_proxy: ${no_proxy:-localhost,127.0.0.1,::1,host.docker.internal,.aliyuncs.com,dashscope.aliyuncs.com}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      ALL_PROXY: ${ALL_PROXY:-}
      http_proxy: ${http_proxy:-}
      https_proxy: ${https_proxy:-}
      all_proxy: ${all_proxy:-}
    command: ["python", "-m", "agents.worker"]
    expose:
      - "9464"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import sys; data=open('/proc/1/cmdline','rb').read(); sys.exit(0 if b'agents.worker' in data else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      skill-storage-init:
        condition: service_completed_successfully

  # -------------------------------------------------------------------------
  # Disposable contract-test runner — production runtime plus locked dev tools
  # -------------------------------------------------------------------------
  test-runner:
    image: ${OPENTRACE_TEST_IMAGE:-opentrace-test:local}
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.test
      args:
        OPENTRACE_IMAGE: ${OPENTRACE_IMAGE:-opentrace-app:local}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple}
        PIP_EXTRA_INDEX_URL: ${PIP_EXTRA_INDEX_URL:-}
    profiles:
      - test
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-changeme}@postgres:5432/opentrace_v2
      TOKEN_DB_URL: postgresql://postgres:${POSTGRES_PASSWORD:-changeme}@postgres:5432/opentrace_v2
      REDIS_URL: redis://redis:6379/10
      PYTHONDONTWRITEBYTECODE: "1"

  prometheus:
    image: prom/prometheus:latest
    container_name: opentrace_prometheus
    restart: unless-stopped
    ports:
      - "14190:9090"
    volumes:
      - ./deploy/docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/observability/prometheus-rules.yml:/etc/prometheus/prometheus-rules.yml:ro
    profiles:
      - observability

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: opentrace_jaeger
    restart: unless-stopped
    ports:
      - "14186:16686"
      - "4317:4317"
    profiles:
      - observability

volumes:
  postgres_data:
  redis_data:
  skills_data:
  skill_catalog_data:
  object_data:
  dws_data:
